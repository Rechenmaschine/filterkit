[workspace]
members = ["plot"]
resolver = "2"

[package]
name = "filterkit"
version = "0.1.0"
edition = "2021"
description = "Composable DSP filters and processors for embedded and desktop Rust."
license = "MIT OR Apache-2.0"
keywords = ["dsp", "filter", "signal-processing", "no-std", "embedded"]
categories = ["no-std", "science", "embedded"]

[features]
default = ["std", "design"]
std = ["alloc", "num-traits/std"]
alloc = []
design = ["dep:libm"]

[dependencies]
num-traits = { version = "0.2", default-features = false }
libm = { version = "0.2", optional = true }

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "throughput"
harness = false
