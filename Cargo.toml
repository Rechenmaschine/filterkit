[workspace]
members = ["plot"]
resolver = "2"

[package]
name = "filterkit"
version = "0.1.0"
edition = "2021"
description = "Composable DSP filters and processors for embedded and desktop Rust."
license = "MIT OR Apache-2.0"
keywords = ["dsp", "filter", "signal-processing", "no-std", "embedded"]
categories = ["no-std", "science", "embedded"]

[features]
default = ["std", "design"]
std = ["alloc", "num-traits/std"]
alloc = []
design = ["dep:libm"]
# State estimators (Kalman, RTS, …). Pulls in nalgebra for matrix
# algebra; kept out of the default set so the core stays zero-dep.
kalman = ["dep:nalgebra"]

[dependencies]
num-traits = { version = "0.2", default-features = false }
libm = { version = "0.2", optional = true }
nalgebra = { version = "0.33", default-features = false, features = ["libm"], optional = true }

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "throughput"
harness = false

[[example]]
name = "biquad_lowpass"
required-features = ["design"]

[[example]]
name = "combinator_chain"
required-features = ["design"]

[[example]]
name = "ema_smoothing"
required-features = ["design"]

[[example]]
name = "fir_moving_average"
required-features = ["design"]

[[example]]
name = "kalman_tracking"
required-features = ["kalman"]

[[example]]
name = "lms_noise_cancel"
required-features = ["alloc"]

[[example]]
name = "polyphase_resample"
required-features = ["alloc", "design"]

[[example]]
name = "zero_phase_filtfilt"
required-features = ["alloc", "design"]
